name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Tests
        run: python -m pytest tests -q
      - name: The committed briefings rebuild byte for byte
        run: |
          python -m briefing.cli verify --date 2026-08-31
          python -m briefing.cli verify --date 2026-09-15 --previous 2026-08-31
